# Answer-only RAG variant for reusing saved retrieval results.
# This intentionally contains only the settings needed by the CLI answer fast path.

name: "RAG (answer_prompt_cot_minimal)"
version: "1.0"
description: "RAG answer-only rerun using the minimal final-answer prompt"

adapter: "rag"

llm:
  provider: "openai"
  # Keep the answer model used by locomo-rag-fixed-settings fixed.
  model: "gpt-4o-mini"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 16384

answer:
  prompt_key: "answer_prompt_cot_minimal"
  num_workers: 50
  max_retries: 3
