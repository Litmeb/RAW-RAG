# Mem0 System Configuration

name: "mem0"
version: "1.0"
description: "Mem0"

adapter: "mem0"
client_mode: "cloud"

# Mem0 API configuration
api_key: "${MEM0_API_KEY}"
batch_size: 5  # Number of messages to batch per API call
max_retries: 3  # Number of attempts for failed Mem0 API calls
max_content_length: 8000  # Maximum content length per message (API limit)
add_interval: 0.5  # Seconds to wait between add requests (to avoid rate limits)

# Add-stage recovery: skip conversations whose local completed-batch state is complete.
# If local state is missing or partial, the adapter clears that conversation and re-adds it.
add_resume:
  enabled: true
  state_file: "mem0_add_resume.json"

# Concurrency configuration
num_workers: 5  # Number of concurrent conversations to process

# Dataset-specific overrides
dataset_overrides:
  memoryagentbench:
    batch_size: 2  # Align with Memos for long MemoryAgentBench context chunks
    search:
      top_k: 20

# ⏰ Post-Add Wait: Wait for server-side processing before downstream stages.
post_add_wait_seconds: 600  # Default 10 minutes. Set to 0 to disable.

# LLM configuration (for answer generation)
llm:
  provider: "openai"
  model: "${LLM_MODEL:gpt-4o-mini}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 16384

# Search configuration
search:
  top_k: 20  # Number of results per user (in dual-perspective mode, total = 2 * top_k)
  search_interval: 0.5  # Seconds to wait between search requests (to avoid 429 errors)

# Answer configuration
answer:
  max_retries: 3

