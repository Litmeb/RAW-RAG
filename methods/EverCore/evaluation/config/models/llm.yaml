# Mem0 local SDK LLM configuration.
# Used by methods/EverCore/evaluation/config/systems/mem0_local.yaml.

mem0:
  provider: "openai"
  config:
    model: "${LLM_MODEL:gpt-4o-mini}"
    api_key: "${LLM_API_KEY}"
    openai_base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
    temperature: 0
    max_tokens: 16384
